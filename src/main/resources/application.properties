spring.application.name=Formula1Api

# banco H2 em memoria, some quando a aplicacao para (usuario sa, senha vazia)
spring.datasource.url=jdbc:h2:mem:formula1db
spring.datasource.username=sa
spring.datasource.password=

# console do banco em http://localhost:8080/h2-console (o H2 so deixa abrir do proprio pc)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# troca pra true se quiser ver os SQLs no console
spring.jpa.show-sql=false

# ordena os endpoints do swagger pelo metodo http
springdoc.swagger-ui.operations-sorter=method
# o swagger abre na v2 (a v1 esta obsoleta) e lembra a chave do Authorize mesmo recarregando a pagina
springdoc.swagger-ui.urls-primary-name=Formula 1 API v2
springdoc.swagger-ui.persist-authorization=true
# comeca com os grupos fechados (a primeira tela vira um mapa da api), tem busca por grupo,
# os campos ja vem prontos pra editar e mostra quanto tempo cada requisicao levou
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

# no render a api fica atras de um proxy https, isso faz os links e o swagger sairem com https
server.forward-headers-strategy=framework

# as chaves criadas quando a aplicacao sobe nao ficam no codigo:
# no seu pc vem do arquivo .env (fora do git, veja o .env.example), no render das variaveis de ambiente
# sem elas a api nem sobe, assim nunca roda com uma chave que alguem conhece
spring.config.import=optional:file:.env[.properties]
app.security.admin-key=${ADMIN_API_KEY}
app.security.user-key=${USER_API_KEY}

# planos: quantas requisicoes por minuto antes de tomar 429
# visitante (sem chave) conta por IP, as chaves USER e ADMIN contam por chave
app.rate-limit.requests-per-minute=${RATE_LIMIT_PER_MINUTE:20}
app.rate-limit.user-requests-per-minute=${RATE_LIMIT_USER_PER_MINUTE:100}
app.rate-limit.admin-requests-per-minute=${RATE_LIMIT_ADMIN_PER_MINUTE:1000}

# sites que podem chamar a api pelo navegador (CORS), separados por virgula
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500}
